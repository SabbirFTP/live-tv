<!DOCTYPE html>
<html>
<head>
  <title>Deobfuscate in Browser</title>
</head>
<body>
  <h3>Deobfuscated Output:</h3>
  <pre id="output" style="white-space: pre-wrap; word-break: break-all; font-family: monospace; padding: 10px; background: #eee; border: 1px solid #ccc;"></pre>

  <script>
    // 1. Paste the exact setup block from index.html (the array, rotation, and decoder function _0x495f)
    // We will load it dynamically or inline it.
    // To make it easy, we can fetch the obfuscated_raw.js file, extract the setup block,
    // evaluate it in this script, and then replace the calls.
    
    async function run() {
      const outputEl = document.getElementById('output');
      try {
        const response = await fetch('obfuscated_raw.js');
        const rawCode = await response.text();
        
        // Find rotation IIFE ending
        const setupMatch = rawCode.match(/^([\s\S]*?\(_0x4d2f,\s*[^)]+?\)\);?)/);
        if (!setupMatch) {
          outputEl.textContent = "Error: Could not extract setup block!";
          return;
        }
        
        const setupCode = setupMatch[1];
        
        // Evaluate setup code in the global scope of this page
        // This will define _0x4d2f, _0x495f, and run the rotation IIFE
        const evalScript = document.createElement('script');
        evalScript.textContent = setupCode + "\nwindow.decoderFn = _0x495f;";
        document.body.appendChild(evalScript);
        
        if (!window.decoderFn) {
          outputEl.textContent = "Error: Decoder function _0x495f was not defined after eval.";
          return;
        }
        
        // Now get the remaining code
        const remainingCode = rawCode.substring(setupCode.length);
        
        // Replace all _0x495f calls
        let replacedCode = remainingCode;
        const callRegex = /_0x495f\(\s*(0x[0-9a-fA-F]+|-?0x[0-9a-fA-F]+)(?:,\s*('[^']+'|"[^"]+"))?\s*\)/g;
        
        replacedCode = replacedCode.replace(callRegex, (match, hexArg, strArg) => {
          try {
            const val1 = parseInt(hexArg, 16);
            let result;
            if (strArg) {
              const val2 = eval(strArg);
              result = window.decoderFn(val1, val2);
            } else {
              result = window.decoderFn(val1);
            }
            return JSON.stringify(result);
          } catch (err) {
            console.error("Failed to decode call: " + match, err);
            return match;
          }
        });
        
        // Set the output
        outputEl.textContent = replacedCode;
      } catch (err) {
        outputEl.textContent = "Error: " + err.message + "\n" + err.stack;
      }
    }
    
    run();
  </script>
</body>
</html>
